[project]
name = "automationbench-context-engine"
version = "1.0.0"
description = "Located feedback on AutomationBench attempts, for a self-distillation teacher."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long message strings stay on one line; zip(strict=...), loop-variable closures and short names are kept as
# trained, because changing them could change the feedback this version must reproduce exactly.
ignore = ["E501", "E741", "B905", "B023"]
